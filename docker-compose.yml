services:
  web:
    build: .
    image: ghcr.io/scalingai/portfoliotati:latest
    container_name: portfoliotati
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?falta definir DOMAIN en el archivo .env}
    volumes:
      # Persiste los certificados de Let's Encrypt. Sin esto, cada restart
      # pide certificados nuevos y se choca con el rate limit de LE.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
